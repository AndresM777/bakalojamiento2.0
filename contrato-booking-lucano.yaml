openapi: 3.0.3
info:
  title: AlojamientoMR - Contrato de Integración Exclusivo B2B (Booking)
  description: |
    API pública unificada expuesta a través de YARP API Gateway estrictamente para la integración de reservas con Booking.com u otros socios B2B.
    Todas las solicitudes se enrutan a través del Gateway central, aplicando mapeos de rutas específicos y redirigiéndolas al microservicio de Reservas.
    Esta especificación detalla EXCLUSIVAMENTE las operaciones disponibles para la gestión de Reservas (Booking) con los prefijos de ruta personalizados (-lucano).
  version: 1.1.0

servers:
  - url: https://api-gateway-mr.onrender.com
    description: Servidor de Producción (YARP Gateway)
  - url: http://localhost:5001
    description: Gateway en Desarrollo Local

tags:
  - name: Reservas (Booking)
    description: Creación, consulta y gestión de reservas de habitaciones (redirigido a Reservas.API)

paths:
  # ════════════════════════════════════════
  # MÓDULO: RESERVAS (booking-lucano-route)
  # ════════════════════════════════════════

  /api/v1/booking-lucano:
    post:
      tags: [Reservas (Booking)]
      summary: Crear una nueva reserva (Crear Reserva)
      description: |
        Inicia y procesa la creación de una reserva. Valida internamente disponibilidad gRPC con Alojamientos.
        Redirigido internamente por el Gateway a: `POST /api/v1/reservas-lucano`
      operationId: CrearReserva
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CrearReservaRequest'
      responses:
        '201':
          description: Reserva creada con éxito
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservaResponse'
        '400':
          description: Error de validación de negocio (Fechas incorrectas, habitación no disponible)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: "Habitación 1 no disponible: Las fechas seleccionadas ya no están disponibles."
                details: "BusinessRuleException"

  /api/v1/booking-lucano/{id}:
    get:
      tags: [Reservas (Booking)]
      summary: Consultar reserva por ID
      description: |
        Devuelve el detalle completo de una reserva específica incluyendo habitaciones y desglose de montos.
        Redirigido internamente por el Gateway a: `GET /api/v1/reservas-lucano/{id}`
      operationId: GetReservaById
      parameters:
        - name: id
          in: path
          required: true
          description: ID único de la reserva
          schema:
            type: integer
      responses:
        '200':
          description: Reserva obtenida con éxito
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservaResponse'
        '404':
          description: Reserva no encontrada

  /api/v1/booking-lucano/cliente/{clienteId}:
    get:
      tags: [Reservas (Booking)]
      summary: Consultar reservas de un cliente
      description: |
        Lista el historial completo de reservas de un huésped.
        Redirigido internamente por el Gateway a: `GET /api/v1/reservas-lucano/cliente/{clienteId}`
      operationId: GetReservasByClienteId
      parameters:
        - name: clienteId
          in: path
          required: true
          description: ID del cliente
          schema:
            type: integer
      responses:
        '200':
          description: Listado obtenido con éxito
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ReservaResponse'

  /api/v1/booking-lucano/resumen/cliente/{clienteId}:
    get:
      tags: [Reservas (Booking)]
      summary: Obtener resumen liviano de reservas de un cliente
      description: |
        Retorna la lista de reservas en un formato liviano (sin desglose de habitaciones) óptimo para listados.
        Redirigido internamente por el Gateway a: `GET /api/v1/reservas-lucano/resumen/cliente/{clienteId}`
      operationId: GetResumenReservasByClienteId
      parameters:
        - name: clienteId
          in: path
          required: true
          description: ID del cliente
          schema:
            type: integer
      responses:
        '200':
          description: Resumen obtenido con éxito
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ReservaResumenResponse'

  /api/v1/booking-lucano/{id}/estado:
    patch:
      tags: [Reservas (Booking)]
      summary: Actualizar estado de una reserva
      description: |
        Cambia el estado de una reserva (Ej: Confirmada, Cancelada, Completada).
        Redirigido internamente por el Gateway a: `PATCH /api/v1/reservas-lucano/{id}/estado`
      operationId: ActualizarEstadoReserva
      parameters:
        - name: id
          in: path
          required: true
          description: ID único de la reserva
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActualizarEstadoReservaRequest'
      responses:
        '204':
          description: Estado actualizado con éxito (Sin contenido)
        '400':
          description: Estado inválido suministrado
        '404':
          description: Reserva no encontrada

# ════════════════════════════════════════
# COMPONENTES / MODELOS (SCHEMAS)
# ════════════════════════════════════════
components:
  schemas:

    # -- Modelos de Reservas (Booking) --
    CrearReservaRequest:
      type: object
      required:
        - clienteId
        - alojamientoId
        - fechaCheckIn
        - fechaCheckOut
        - habitaciones
      properties:
        clienteId:
          type: integer
          example: 1
        alojamientoId:
          type: integer
          example: 1
        fechaCheckIn:
          type: string
          format: date
          example: "2026-06-01"
        fechaCheckOut:
          type: string
          format: date
          example: "2026-06-05"
        numAdultos:
          type: integer
          default: 1
          example: 2
        numNinos:
          type: integer
          default: 0
          example: 0
        llevaMascotas:
          type: boolean
          default: false
          example: false
        codigoDescuento:
          type: string
          nullable: true
          example: "DESCUENTO20"
        habitaciones:
          type: array
          items:
            $ref: '#/components/schemas/DetalleHabitacionRequest'

    DetalleHabitacionRequest:
      type: object
      required:
        - habitacionId
        - precioPorNoche
        - numNoches
      properties:
        habitacionId:
          type: integer
          example: 1
        precioPorNoche:
          type: number
          minimum: 1
          example: 50.00
        numNoches:
          type: integer
          minimum: 1
          example: 4

    ReservaResponse:
      type: object
      properties:
        reservaId:
          type: integer
          example: 55
        clienteId:
          type: integer
          example: 1
        alojamientoId:
          type: integer
          example: 1
        fechaCheckIn:
          type: string
          format: date
          example: "2026-06-01"
        fechaCheckOut:
          type: string
          format: date
          example: "2026-06-05"
        numAdultos:
          type: integer
          example: 2
        numNinos:
          type: integer
          example: 0
        llevaMascotas:
          type: boolean
          example: false
        numHabitaciones:
          type: integer
          example: 1
        subTotal:
          type: number
          example: 200.00
        total:
          type: number
          example: 180.00
        estado:
          type: string
          example: "Pendiente"
        codigoReserva:
          type: string
          example: "RES-55-x9a2"
        fechaCreacion:
          type: string
          format: date-time
          example: "2026-05-20T03:35:00Z"
        detallesHabitacion:
          type: array
          items:
            $ref: '#/components/schemas/DetalleHabitacionResponse'
        codigoDescuentoAplicado:
          type: string
          nullable: true
          example: "DESCUENTO20"
        porcentajeDescuento:
          type: number
          nullable: true
          example: 10.00

    DetalleHabitacionResponse:
      type: object
      properties:
        detalleId:
          type: integer
          example: 120
        habitacionId:
          type: integer
          example: 1
        precioPorNoche:
          type: number
          example: 50.00
        numNoches:
          type: integer
          example: 4
        subTotalHabitacion:
          type: number
          example: 200.00

    ReservaResumenResponse:
      type: object
      description: Formato simplificado sin listado de habitaciones para búsquedas ligeras.
      properties:
        reservaId:
          type: integer
          example: 55
        clienteId:
          type: integer
          example: 1
        alojamientoId:
          type: integer
          example: 1
        fechaCheckIn:
          type: string
          format: date
          example: "2026-06-01"
        fechaCheckOut:
          type: string
          format: date
          example: "2026-06-05"
        numHabitaciones:
          type: integer
          example: 1
        total:
          type: number
          example: 180.00
        estado:
          type: string
          example: "Pendiente"
        codigoReserva:
          type: string
          example: "RES-55-x9a2"
        fechaCreacion:
          type: string
          format: date-time
          example: "2026-05-20T03:35:00Z"

    ActualizarEstadoReservaRequest:
      type: object
      required:
        - estado
      properties:
        estado:
          type: string
          maxLength: 30
          example: "Confirmada"

    # -- Estructura de Error --
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: "Habitación 1 no disponible: Error de disponibilidad."
        details:
          type: string
          example: "BusinessRuleException"
